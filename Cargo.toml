[package]
name = "stealthbar"
version = "0.5.1"
edition = "2024"
description = "Battery and mic status of a Turtle Beach Stealth Pro II headset, as JSON lines for a status bar"
license = "MIT"
repository = "https://github.com/Ronll/stealthbar"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[profile.release]
lto = true
strip = true
