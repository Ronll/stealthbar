id = "ronll/stealthbar"
name = "Stealth Pro II"
version = "0.1.0"
plugin_api = 3
author = "Ronll"
license = "MIT"
icon = "headphones"
description = "Battery, charging and mic mute of a Turtle Beach Stealth Pro II headset; shown only while the headset is on."
dependencies = ["stealthbar"]
tags = ["bar", "indicator", "audio", "battery"]

[[widget]]
id = "stealthbar"
entry = "widget.luau"

  [[widget.setting]]
  key = "command"
  type = "string"
  label_key = "settings.command.label"
  description_key = "settings.command.description"
  default = "stealthbar watch"

  [[widget.setting]]
  key = "low_battery"
  type = "int"
  label_key = "settings.low_battery.label"
  description_key = "settings.low_battery.description"
  default = 15
  min = 0
  max = 100
  step = 5
